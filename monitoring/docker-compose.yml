version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: agen46-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - agen46-prometheus-data:/prometheus
    networks:
      - agen46-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: agen46-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=agen46admin
    volumes:
      - agen46-grafana-data:/var/lib/grafana
    networks:
      - agen46-net
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  agen46-net:
    external: true

volumes:
  agen46-prometheus-data:
  agen46-grafana-data:
