version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: agen46-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - agen46-prometheus-data:/prometheus
    networks:
      - agen46-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: agen46-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=agen46admin
    volumes:
      - agen46-grafana-data:/var/lib/grafana
    networks:
      - agen46-net
    restart: unless-stopped
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.9.0
    container_name: agen46-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - agen46-loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - agen46-net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    container_name: agen46-promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - agen46-net
    restart: unless-stopped
    depends_on:
      - loki

networks:
  agen46-net:
    external: true

volumes:
  agen46-prometheus-data:
  agen46-grafana-data:
  agen46-loki-data:
